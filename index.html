<!DOCTYPE html>
<html>
<style>

body {
    background-image: url('background.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
}
button {
    font-size: 32px;
    padding: 30px;
    margin: 10px;
    border-radius: 15px;
    cursor: pointer;
}
.soundGrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 25px 90px;
    width: 62%;
    height: 50%;
    margin: 360px auto 0;
}

.soundGrid button {
    width: 100%;
    height: 100%;
    padding: 0;
    margin: 0;
    font-size: 24px;
    background: rgba(40, 55, 150, 0.85);
color: white;
border: 2px solid white;
}
</style>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<title>TARDIS Soundboard</title>

</head>
<script>

let sounds = [];

function playSound(file) {

let sound = new Audio(file);

sounds.push(sound);

sound.play();

sound.onended = function() {

let index = sounds.indexOf(sound);

if (index !== -1) {

sounds.splice(index, 1);

}

};

}

function stopSound() {

for (let i = 0; i < sounds.length; i++) {

sounds[i].pause();
sounds[i].currentTime = 0;

}

sounds = [];

}

</script>
<body>


<button
onclick="stopSound()"
style="font-size:28px; padding:20px; margin:20px; width:90%;">
STOP
</button>   
<div class="soundGrid">   
<button
onclick="playSound('TARDIS.mp3')"
style="font-size:32px; padding:30px; margin:10px;">
TARDIS
</button>   
<button
onclick="playSound('Dalek.mp3')"
style="font-size:32px; padding:30px; margin:10px;">
DALEK
</button>

<button
onclick="playSound('Cyberman.mp3')"
style="font-size:32px; padding:30px; margin:10px;">
CYBERMAN
</button>   

<button
onclick="playSound('Theme.mp3')"
style="font-size:32px; padding:30px; margin:10px;">
THEME
</button>

<button
onclick="playSound('Vortex.mp3')"
style="font-size:32px; padding:30px; margin:10px;">
VORTEX
</button>

<button
onclick="playSound('Sonic.mp3')"
style="font-size:32px; padding:30px; margin:10px;">
SONIC
</button>
    
</div>    
</body>

</html>

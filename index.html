<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TARDIS Soundboard</title>

</head>
<script>

function playSound(file) {

let sound = new Audio(file);

sound.play();

}

</script>
<body>

<h1>🚪 TARDIS Soundboard</h1>

<button
onclick="playSound('TARDIS.mp3')"
style="font-size:32px; padding:30px; margin:10px;">
🔊 TARDIS
</button>

</body>

</html>

<!DOCTYPE html>
<html>
<style>

body {
    background-color: #111;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
}
button {
    font-size: 32px;
    padding: 30px;
    margin: 10px;
    border-radius: 15px;
    cursor: pointer;
}
</style>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TARDIS Soundboard</title>

</head>
<script>

function playSound(file) {

let sound = new Audio(file);

sound.play();

}

</script>
<body>

<h1 style="font-size:40px; margin-bottom:30px;">
🚪 TARDIS SOUNDBOARD
</h1>

<button
onclick="playSound('TARDIS.mp3')"
style="font-size:32px; padding:30px; margin:10px;">
🔊 TARDIS
</button>
<button
onclick="playSound('Dalek.mp3')"
style="font-size:32px; padding:30px; margin:10px;">
👽 DALEK
</button>
</body>

</html>

<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TARDIS Soundboard</title>

</head>
<script>

function playSound(file) {

let sound = new Audio(file);

sound.play();

}

</script>
<body>

<h1>🚪 TARDIS Soundboard</h1>

<button onclick="playSound('sounds/tardis.mp3')">
🔊 TARDIS
</button>

</body>

</html>

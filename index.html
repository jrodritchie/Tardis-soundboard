<!DOCTYPE html>
<html>
<style>

body {
    background-color: #111;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
}
button {
    font-size: 32px;
    padding: 30px;
    margin: 10px;
    border-radius: 15px;
    cursor: pointer;
}
.soundGrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 15px;
}    
</style>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TARDIS Soundboard</title>

</head>
<script>

let currentSound = null;

function playSound(file) {

currentSound = new Audio(file);

currentSound.play();

}

function stopSound() {

if (currentSound) {

currentSound.pause();
currentSound.currentTime = 0;

}

}

</script>
<body>

<h1 style="font-size:40px; margin-bottom:30px;">
🚪 TARDIS SOUNDBOARD
</h1>
<button
onclick="stopSound()"
style="font-size:28px; padding:20px; margin:10px;">
🔇 STOP ALL SOUNDS
</button>   
<div class="soundGrid">   
<button
onclick="playSound('TARDIS.mp3')"
style="font-size:32px; padding:30px; margin:10px;">
🔊 TARDIS
</button>   
<button
onclick="playSound('Dalek.mp3')"
style="font-size:32px; padding:30px; margin:10px;">
👽 DALEK
</button>

<button
onclick="playSound('Cyberman.mp3')"
style="font-size:32px; padding:30px; margin:10px;">
🦾 CYBERMAN
</button>   

<button
onclick="playSound('Theme.mp3')"
style="font-size:32px; padding:30px; margin:10px;">
🎵 THEME
</button>

<button
onclick="playSound('Vortex.mp3')"
style="font-size:32px; padding:30px; margin:10px;">
🌀 VORTEX
</button>

<button
onclick="playSound('Sonic.mp3')"
style="font-size:32px; padding:30px; margin:10px;">
🪄 SONIC
</button>
    
</div>    
</body>

</html>
